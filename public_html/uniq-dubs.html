<!DOCTYPE html>
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>SoundCloud Embeds</title>

	<style>
		/* ========================================
		   Destyle
		======================================== */

		*,
		::before,
		::after {
			box-sizing: border-box;
			border-style: solid;
			border-width: 0;
			min-width: 0;
		}

		html {
			line-height: 1.15;
			-webkit-text-size-adjust: 100%;
			-webkit-tap-highlight-color: transparent;
		}

		body {
			margin: 0;
		}

		main {
			display: block;
		}

		p,
		table,
		blockquote,
		address,
		pre,
		iframe,
		form,
		figure,
		dl {
			margin: 0;
		}

		h1,
		h2,
		h3,
		h4,
		h5,
		h6 {
			font-size: inherit;
			font-weight: inherit;
			margin: 0;
		}

		ul,
		ol {
			margin: 0;
			padding: 0;
			list-style: none;
		}

		dt {
			font-weight: bold;
		}

		dd {
			margin-left: 0;
		}

		hr {
			box-sizing: content-box;
			height: 0;
			overflow: visible;
			border-top-width: 1px;
			margin: 0;
			clear: both;
			color: inherit;
		}

		pre {
			font-family: monospace, monospace;
			font-size: inherit;
		}

		address {
			font-style: inherit;
		}

		a {
			background-color: transparent;
			text-decoration: none;
			text-underline-offset: 1px;
			color: inherit;
		}

		abbr[title] {
			text-decoration: underline dotted;
		}

		b,
		strong {
			font-weight: bolder;
		}

		code,
		kbd,
		samp {
			font-family: monospace, monospace;
			font-size: inherit;
		}

		small {
			font-size: 80%;
		}

		sub,
		sup {
			font-size: 75%;
			line-height: 0;
			position: relative;
			vertical-align: baseline;
		}

		sub {
			bottom: -0.25em;
		}

		sup {
			top: -0.5em;
		}

		svg,
		img,
		embed,
		object,
		iframe {
			vertical-align: bottom;
		}

		button,
		input,
		optgroup,
		select,
		textarea {
			-webkit-appearance: none;
			appearance: none;
			vertical-align: middle;
			color: inherit;
			font: inherit;
			background: transparent;
			padding: 0;
			margin: 0;
			border-radius: 0;
			text-align: inherit;
			text-transform: inherit;
		}

		button,
		[type="button"],
		[type="reset"],
		[type="submit"] {
			cursor: pointer;
		}

		button:disabled,
		[type="button"]:disabled,
		[type="reset"]:disabled,
		[type="submit"]:disabled {
			cursor: default;
		}

		:-moz-focusring {
			outline: auto;
		}

		select:disabled {
			opacity: inherit;
		}

		option {
			padding: 0;
		}

		fieldset {
			margin: 0;
			padding: 0;
			min-width: 0;
		}

		legend {
			padding: 0;
		}

		progress {
			vertical-align: baseline;
		}

		textarea {
			overflow: auto;
		}

		[type="number"]::-webkit-inner-spin-button,
		[type="number"]::-webkit-outer-spin-button {
			height: auto;
		}

		[type="search"] {
			outline-offset: -2px;
		}

		[type="search"]::-webkit-search-decoration {
			-webkit-appearance: none;
		}

		::-webkit-file-upload-button {
			-webkit-appearance: button;
			font: inherit;
		}

		[type="number"] {
			-moz-appearance: textfield;
		}

		label[for] {
			cursor: pointer;
		}

		details {
			display: block;
		}

		summary {
			display: list-item;
		}

		[contenteditable]:focus {
			outline: auto;
		}

		table {
			border-color: inherit;
			border-collapse: collapse;
		}

		caption {
			text-align: left;
		}

		td,
		th {
			vertical-align: top;
			padding: 0;
		}

		th {
			text-align: left;
			font-weight: bold;
		}


		/* ========================================
		   Page
		======================================== */

		body {
			font-family:
				-apple-system,
				BlinkMacSystemFont,
				"Helvetica Neue",
				"Yu Gothic",
				YuGothic,
				Arial,
				sans-serif;
			font-size: 16px;
			line-height: 1.6;
			color: #111;
			background: #fff;
		}

		.page {
			width: min(100% - 40px, 900px);
			margin: 0 auto;
			padding: 60px 0;
		}

		.last-updated {
			margin-bottom: 40px;
			font-size: 14px;
			color: #666;
		}

		.artist + .artist {
			margin-top: 80px;
		}

		.artist-name {
			margin-bottom: 32px;
			font-size: 28px;
			line-height: 1.3;
			font-weight: 700;
		}

		.track + .track {
			margin-top: 40px;
		}

		.track-title {
			margin-bottom: 12px;
			font-size: 18px;
			line-height: 1.4;
			font-weight: 700;
		}

		.track-comment {
			margin-top: 8px;
			font-size: 13px;
			line-height: 1.6;
			color: #777;
			white-space: pre-wrap;
		}


		/* ========================================
		   SoundCloud
		======================================== */

		.soundcloud-embed {
			display: block;
			width: 100%;
			height: 166px;
			border: 0;
		}

		.soundcloud-info {
			font-size: 10px;
			line-height: 1.4;
			color: #ccc;
			overflow: hidden;
			white-space: nowrap;
			text-overflow: ellipsis;
			font-family:
				Interstate,
				"Lucida Grande",
				"Lucida Sans Unicode",
				"Lucida Sans",
				Garuda,
				Verdana,
				Tahoma,
				sans-serif;
			font-weight: 100;
		}

		.soundcloud-info a {
			color: #ccc;
			text-decoration: none;
		}

		@media (max-width: 600px) {
			.page {
				width: min(100% - 24px, 900px);
				padding: 32px 0;
			}

			.last-updated {
				margin-bottom: 24px;
				font-size: 13px;
			}

			.artist-name {
				font-size: 24px;
			}

			.track-title {
				font-size: 16px;
			}

			.track-comment {
				font-size: 12px;
			}
		}
	</style>
</head>

<body>

	<main class="page" id="app"></main>


	<script>
		/* ========================================
		   Content
		   ここだけ差し替える
		======================================== */

		const updatedAt = "2026年10月7日現在";

		const artists = [
			{
				name: "noctane 2",

				tracks: [
					{
						name: "3 - to your eternity",

						soundcloud:
							"https://api.soundcloud.com/tracks/soundcloud%3Atracks%3A2188807347",

						artistUrl:
							"https://soundcloud.com/color-bass-2-ids",

						trackUrl:
							"https://soundcloud.com/color-bass-2-ids/3-lptp-2youreternity",

						comment:
							"ここにトラックに関するコメントやメモが入ります。"
					}
				]
			}
		];


		/* ========================================
		   Common SoundCloud Embed
		======================================== */

		function createSoundCloudEmbed(track) {

			const wrapper = document.createElement("div");

			const iframe = document.createElement("iframe");

			iframe.className = "soundcloud-embed";

			iframe.width = "100%";
			iframe.height = "166";
			iframe.scrolling = "no";
			iframe.frameBorder = "no";
			iframe.allow = "autoplay; encrypted-media";

			const params = new URLSearchParams({
				url: track.soundcloud,
				color: "#ff5500",
				auto_play: "false",
				hide_related: "false",
				show_comments: "true",
				show_user: "true",
				show_reposts: "false",
				show_teaser: "true"
			});

			iframe.src =
				"https://w.soundcloud.com/player/?" +
				params.toString();

			wrapper.appendChild(iframe);


			/* SoundCloud attribution */

			const info = document.createElement("div");

			info.className = "soundcloud-info";

			const artistLink = document.createElement("a");

			artistLink.href = track.artistUrl;
			artistLink.title = artists.find(
				artist =>
					artist.tracks.includes(track)
			)?.name || "";

			artistLink.target = "_blank";
			artistLink.rel = "noopener noreferrer";
			artistLink.textContent =
				artists.find(
					artist =>
						artist.tracks.includes(track)
				)?.name || "";

			const separator = document.createTextNode(" · ");

			const trackLink = document.createElement("a");

			trackLink.href = track.trackUrl;
			trackLink.title = track.name;
			trackLink.target = "_blank";
			trackLink.rel = "noopener noreferrer";
			trackLink.textContent = track.name;

			info.appendChild(artistLink);
			info.appendChild(separator);
			info.appendChild(trackLink);

			wrapper.appendChild(info);

			return wrapper;
		}


		/* ========================================
		   Render
		======================================== */

		const app = document.getElementById("app");


		/* Last Updated */

		if (updatedAt) {
			const updatedElement = document.createElement("p");
			updatedElement.className = "last-updated";
			updatedElement.textContent = updatedAt;
			app.appendChild(updatedElement);
		}


		/* Artists & Tracks */

		artists.forEach((artist) => {

			const artistElement =
				document.createElement("section");

			artistElement.className = "artist";


			const artistName =
				document.createElement("h2");

			artistName.className = "artist-name";
			artistName.textContent = artist.name;

			artistElement.appendChild(artistName);


			artist.tracks.forEach((track) => {

				const trackElement =
					document.createElement("article");

				trackElement.className = "track";


				const trackTitle =
					document.createElement("h3");

				trackTitle.className = "track-title";
				trackTitle.textContent = track.name;

				trackElement.appendChild(trackTitle);


				trackElement.appendChild(
					createSoundCloudEmbed(track)
				);


				if (track.comment) {
					const trackComment =
						document.createElement("p");

					trackComment.className = "track-comment";
					trackComment.textContent = track.comment;

					trackElement.appendChild(trackComment);
				}


				artistElement.appendChild(trackElement);
			});


			app.appendChild(artistElement);
		});
	</script>

</body>
</html>
